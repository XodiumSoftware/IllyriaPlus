name: Xodium CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - "IllyriaCore/**"
      - "IllyriaBridge/**"
      - "IllyriaResourcePack/**"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "IllyriaCore/**"
      - "IllyriaBridge/**"
      - "IllyriaResourcePack/**"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=crate depName=mdbook
  MDBOOK_VERSION: "0.5.2"
  # renovate: datasource=crate depName=mdbook-variables
  MDBOOK_VARIABLES_VERSION: "0.4.1"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      bridge: ${{ steps.filter.outputs.bridge }}
      resourcepack: ${{ steps.filter.outputs.resourcepack }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - id: filter
        name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        with:
          filters: |
            core:
              - "IllyriaCore/src/**"
              - "IllyriaCore/build.gradle.kts"
              - "IllyriaLib/**"
            bridge:
              - "IllyriaBridge/src/**"
              - "IllyriaBridge/build.gradle.kts"
              - "IllyriaLib/**"
            resourcepack:
              - "IllyriaResourcePack/**"
            all:
              - "settings.gradle.kts"
              - "gradle.properties"
              - ".github/workflows/ci.yml"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.bridge == 'true' ||
      needs.changes.outputs.resourcepack == 'true' ||
      needs.changes.outputs.all == 'true'
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        uses: actions/checkout@v7.0.1

      # --- Kotlin (IllyriaCore / IllyriaBridge) ---
      - id: setup_java
        name: Setup Java
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.bridge == 'true' || needs.changes.outputs.all == 'true'
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 25.0.5+8.0.LTS
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.bridge == 'true' || needs.changes.outputs.all == 'true'
        uses: gradle/actions/setup-gradle@v6.4.1

      - id: run_ktlint
        name: Run ktlint
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.bridge == 'true' || needs.changes.outputs.all == 'true'
        run: ./gradlew ktlintCheck

  build_bridge:
    name: Build IllyriaBridge
    needs: [changes, lint]
    if: needs.changes.outputs.bridge == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: setup_java
        name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 25.0.5+8.0.LTS
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - id: build
        name: Build Plugin
        run: ./gradlew :IllyriaBridge:shadowJar

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: IllyriaBridge
          path: IllyriaBridge/build/libs/*.jar

  release_bridge:
    name: Release IllyriaBridge
    needs: [changes, build_bridge]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.bridge == 'true' || needs.changes.outputs.all == 'true')
    concurrency: nightly-release
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
      url: "${{ steps.create_release.outputs.url }}"
    permissions:
      contents: write
    steps:
      - id: download_artifact
        name: Download IllyriaBridge Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: IllyriaBridge
          path: dist/

      - id: update_nightly_tag
        name: Update Nightly Tag
        run: |
          gh api repos/${{ github.repository }}/git/refs/tags/nightly \
            --method PATCH --field sha=${{ github.sha }} --field force=true 2>/dev/null || \
          gh api repos/${{ github.repository }}/git/refs \
            --method POST --field ref=refs/tags/nightly --field sha=${{ github.sha }}
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: delete_old_assets
        name: Delete Old IllyriaBridge Assets
        run: |
          release_id=$(gh api repos/${{ github.repository }}/releases/tags/nightly --jq '.id' 2>/dev/null || echo "")
          if [ -n "$release_id" ]; then
            asset_ids=$(gh api repos/${{ github.repository }}/releases/$release_id/assets \
              --jq '.[] | select(.name | startswith("IllyriaBridge")) | .id' 2>/dev/null || echo "")
            for asset_id in $asset_ids; do
              gh api repos/${{ github.repository }}/releases/assets/$asset_id --method DELETE
            done
          fi
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: create_release
        name: Create Nightly Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          prerelease: true
          files: dist/*
          tag_name: nightly
          name: Nightly Build

  build_core:
    name: Build IllyriaCore
    needs: [changes, lint]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: setup_java
        name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 25.0.5+8.0.LTS
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - id: build
        name: Build Plugin
        run: ./gradlew :IllyriaCore:shadowJar

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: IllyriaCore
          path: IllyriaCore/build/libs/*.jar

  release_core:
    name: Release IllyriaCore
    needs: [changes, build_core]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.all == 'true')
    concurrency: nightly-release
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
      url: "${{ steps.create_release.outputs.url }}"
    permissions:
      contents: write
    steps:
      - id: download_artifact
        name: Download IllyriaCore Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: IllyriaCore
          path: dist/

      - id: update_nightly_tag
        name: Update Nightly Tag
        run: |
          gh api repos/${{ github.repository }}/git/refs/tags/nightly \
            --method PATCH --field sha=${{ github.sha }} --field force=true 2>/dev/null || \
          gh api repos/${{ github.repository }}/git/refs \
            --method POST --field ref=refs/tags/nightly --field sha=${{ github.sha }}
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: delete_old_assets
        name: Delete Old IllyriaCore Assets
        run: |
          release_id=$(gh api repos/${{ github.repository }}/releases/tags/nightly --jq '.id' 2>/dev/null || echo "")
          if [ -n "$release_id" ]; then
            asset_ids=$(gh api repos/${{ github.repository }}/releases/$release_id/assets \
              --jq '.[] | select(.name | startswith("IllyriaCore")) | .id' 2>/dev/null || echo "")
            for asset_id in $asset_ids; do
              gh api repos/${{ github.repository }}/releases/assets/$asset_id --method DELETE
            done
          fi
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: create_release
        name: Create Nightly Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          prerelease: true
          files: dist/*
          tag_name: nightly
          name: Nightly Build

  build_resourcepack:
    name: Build IllyriaResourcePack
    needs: [changes, lint]
    if: needs.changes.outputs.resourcepack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: cache_packsquash
        name: Cache PackSquash Output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/packsquash
            ${{ runner.temp }}/packsquash-cache
          key: packsquash-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            packsquash-${{ runner.os }}-${{ github.ref }}-
            packsquash-${{ runner.os }}-

      - id: packsquash
        name: Create Zip & Optimize with Packsquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: v0.4.1
          options: |
            pack_directory = 'IllyriaResourcePack'
            output_file_path = '/tmp/pack.zip'
        env:
          PACKSQUASH_CACHE_DIR: ${{ runner.temp }}/packsquash-cache

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: IllyriaResourcePack
          path: /tmp/pack.zip

  release_resourcepack:
    name: Release IllyriaResourcePack
    needs: [changes, build_resourcepack]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.resourcepack == 'true' || needs.changes.outputs.all == 'true')
    concurrency: nightly-release
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
      url: "${{ steps.create_release.outputs.url }}"
    permissions:
      contents: write
    steps:
      - id: download_artifact
        name: Download IllyriaResourcePack Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: IllyriaResourcePack
          path: dist/

      - id: update_nightly_tag
        name: Update Nightly Tag
        run: |
          gh api repos/${{ github.repository }}/git/refs/tags/nightly \
            --method PATCH --field sha=${{ github.sha }} --field force=true 2>/dev/null || \
          gh api repos/${{ github.repository }}/git/refs \
            --method POST --field ref=refs/tags/nightly --field sha=${{ github.sha }}
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: delete_old_assets
        name: Delete Old IllyriaResourcePack Assets
        run: |
          release_id=$(gh api repos/${{ github.repository }}/releases/tags/nightly --jq '.id' 2>/dev/null || echo "")
          if [ -n "$release_id" ]; then
            asset_ids=$(gh api repos/${{ github.repository }}/releases/$release_id/assets \
              --jq '.[] | select(.name == "pack.zip") | .id' 2>/dev/null || echo "")
            for asset_id in $asset_ids; do
              gh api repos/${{ github.repository }}/releases/assets/$asset_id --method DELETE
            done
          fi
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: create_release
        name: Create Nightly Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          prerelease: true
          files: dist/*
          tag_name: nightly
          name: Nightly Build

  # Common per-component release flow: download the component's artifact,
  # then amend the shared rotating 'nightly' prerelease. Each job re-points the
  # tag, deletes only that component's old asset(s), and uploads the new file.
