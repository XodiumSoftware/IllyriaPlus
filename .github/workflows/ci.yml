name: Xodium CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - "IllyriaCore/**"
      - "IllyriaBridge/**"
      - "IllyriaResourcePack/**"
      - "IllyriaWiki/**"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "IllyriaCore/**"
      - "IllyriaBridge/**"
      - "IllyriaResourcePack/**"
      - "IllyriaWiki/**"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=crate depName=mdbook
  MDBOOK_VERSION: "0.5.2"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      bridge: ${{ steps.filter.outputs.bridge }}
      resourcepack: ${{ steps.filter.outputs.resourcepack }}
      wiki: ${{ steps.filter.outputs.wiki }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - id: filter
        name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        with:
          filters: |
            core:
              - "IllyriaCore/src/**"
              - "IllyriaCore/build.gradle.kts"
            bridge:
              - "IllyriaBridge/src/**"
              - "IllyriaBridge/build.gradle.kts"
            resourcepack:
              - "IllyriaResourcePack/**"
            wiki:
              - "IllyriaWiki/**"
            all:
              - "settings.gradle.kts"
              - "gradle.properties"
              - ".github/workflows/ci.yml"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.bridge == 'true' ||
      needs.changes.outputs.all == 'true'
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        uses: actions/checkout@v7.0.1

      - id: setup_java
        name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - id: run_lint
        name: Run Lint
        run: ./gradlew ktlintCheck

  build_core:
    name: Build IllyriaCore
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: setup_java
        name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - id: build
        name: Build Plugin
        run: ./gradlew :IllyriaCore:shadowJar

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: IllyriaCore
          path: IllyriaCore/build/libs/*.jar

  build_bridge:
    name: Build IllyriaBridge
    needs: [changes]
    if: needs.changes.outputs.bridge == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: setup_java
        name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - id: build
        name: Build Plugin
        run: ./gradlew :IllyriaBridge:shadowJar

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: IllyriaBridge
          path: IllyriaBridge/build/libs/*.jar

  build_resourcepack:
    name: Build IllyriaResourcePack - ${{ matrix.name }}
    needs: [changes]
    if: needs.changes.outputs.resourcepack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Full
            artifact: IllyriaResourcePack
            pack_directory: IllyriaResourcePack
            output_file: /tmp/pack.zip
            cache_slug: full
          - name: Assets
            artifact: IllyriaResourcePack-Assets
            pack_directory: IllyriaResourcePack/assets
            output_file: /tmp/pack-assets.zip
            cache_slug: assets
          - name: Overlays
            artifact: IllyriaResourcePack-Overlays
            pack_directory: IllyriaResourcePack/overlay_mod_support
            output_file: /tmp/pack-overlays.zip
            cache_slug: overlays
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: cache_packsquash
        name: Cache PackSquash Output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/packsquash
            ${{ runner.temp }}/packsquash-cache-${{ matrix.cache_slug }}
          key: packsquash-${{ matrix.cache_slug }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            packsquash-${{ matrix.cache_slug }}-${{ runner.os }}-${{ github.ref }}-
            packsquash-${{ matrix.cache_slug }}-${{ runner.os }}-

      - id: packsquash
        name: Create Zip & Optimize with Packsquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: v0.4.1
          options: |
            pack_directory = '${{ matrix.pack_directory }}'
            output_file_path = '${{ matrix.output_file }}'
        env:
          PACKSQUASH_CACHE_DIR: ${{ runner.temp }}/packsquash-cache-${{ matrix.cache_slug }}

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output_file }}

  lint_wiki:
    name: Lint Wiki
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      needs.changes.outputs.wiki == 'true' &&
      !contains(github.event.head_commit.message, '[ci-skip]') &&
      !contains(github.event.pull_request.title, '[ci-skip]')
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - id: setup_node
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - id: install_markdownlint
        name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
        shell: bash

      - id: run_lint
        name: Run Markdown Lint
        run: |
          cd IllyriaWiki
          markdownlint-cli2 --config ../.markdownlint.json "src/**/*.md"
        shell: bash

      - id: lint_summary
        name: Upload Lint Summary
        if: failure()
        run: |
          cd IllyriaWiki
          markdownlint-cli2 --config ../.markdownlint.json "src/**/*.md" --format json > lint-results.json || true
          echo "## ❌ Markdown Lint Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat lint-results.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash

      - id: linkcheck
        name: Link Check
        uses: lycheeverse/lychee-action@v2
        with:
          # Remap lives in lychee.toml at the repo root.
          args: --verbose --no-progress 'IllyriaWiki/src/**/*.md'
          fail: true

  build_wiki:
    name: Build Wiki
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      needs.changes.outputs.wiki == 'true' &&
      !contains(github.event.head_commit.message, '[ci-skip]') &&
      !contains(github.event.pull_request.title, '[ci-skip]')
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: install_cargo_binstall
        name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      - id: cache_mdbook
        name: Cache mdBook
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}

      - id: install_mdbook
        name: Install mdBook
        run: cargo binstall mdbook@${{ env.MDBOOK_VERSION }} --no-confirm --force
        shell: bash

      - id: build_book
        name: Build mdBook
        run: mdbook build IllyriaWiki
        shell: bash

      - id: upload_artifact
        name: Upload book artifact
        uses: actions/upload-artifact@v7
        with:
          name: book
          path: IllyriaWiki/book/

  deploy_wiki:
    name: Deploy Wiki
    runs-on: ubuntu-latest
    needs: [changes, lint_wiki, build_wiki]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.wiki == 'true' &&
      !contains(github.event.head_commit.message, '[ci-skip]') &&
      !contains(github.event.pull_request.title, '[ci-skip]')
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: download_artifact
        name: Download book artifact
        uses: actions/download-artifact@v8
        with:
          name: book
          path: book

      - id: deploy
        name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy book --project-name=illyriawiki --branch=${{ github.ref_name }} --commit-dirty=true

  # Separate deployment jobs for each component - they don't wait for each other
  deploy_core:
    name: Deploy IllyriaCore
    needs: [changes, build_core]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.core == 'true' || needs.changes.outputs.all == 'true')
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    permissions:
      contents: write
    steps:
      - id: deploy
        name: Deploy IllyriaCore
        run: |
          echo "Deploying IllyriaCore artifact"
          # Add your deployment logic here (e.g., upload to release, send to server)
          echo "Artifact available in IllyriaCore"

  deploy_bridge:
    name: Deploy IllyriaBridge
    needs: [changes, build_bridge]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.bridge == 'true' || needs.changes.outputs.all == 'true')
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    permissions:
      contents: write
    steps:
      - id: deploy
        name: Deploy IllyriaBridge
        run: |
          echo "Deploying IllyriaBridge artifact"
          # Add your deployment logic here
          echo "Artifact available in IllyriaBridge"

  deploy_resourcepack:
    name: Deploy IllyriaResourcePack
    needs: [changes, build_resourcepack]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.resourcepack == 'true' || needs.changes.outputs.all == 'true')
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: deploy
        name: Deploy IllyriaResourcePack
        run: |
          echo "Deploying IllyriaResourcePack artifacts"
          # Add your deployment logic here
          echo "Artifacts available in IllyriaResourcePack*"

  pr_comment:
    name: PR Comment
    needs: [changes, build_core, build_bridge, build_resourcepack]
    if: |
      always() && github.event_name == 'pull_request' &&
      (needs.build_core.result == 'success' ||
       needs.build_bridge.result == 'success' ||
       needs.build_resourcepack.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post Artifact Link
        uses: actions/github-script@v9
        with:
          script: |
            const botMarker = '<!-- IllyriaPlus Artifact Bot -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${botMarker}
            Build completed for commit \`${context.sha.substring(0, 7)}\`.

            [View Artifacts](${runUrl})
            [View Workflow Run](${runUrl})
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(botMarker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  nightly_release:
    name: Nightly Release
    # Only depends on changes detection, not on all builds
    needs: [changes]
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
      url: "${{ steps.create_release.outputs.url }}"
    if: |
      always() && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.core == 'true' ||
       needs.changes.outputs.bridge == 'true' ||
       needs.changes.outputs.resourcepack == 'true' ||
       needs.changes.outputs.all == 'true')
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: download_core
        name: Download IllyriaCore Artifact
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.all == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: IllyriaCore
          path: dist/

      - id: download_bridge
        name: Download IllyriaBridge Artifact
        if: needs.changes.outputs.bridge == 'true' || needs.changes.outputs.all == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: IllyriaBridge
          path: dist/

      - id: download_resourcepack
        name: Download IllyriaResourcePack Artifact
        if: needs.changes.outputs.resourcepack == 'true' || needs.changes.outputs.all == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: IllyriaResourcePack
          path: dist/

      - id: download_resourcepack_assets
        name: Download IllyriaResourcePack Assets Artifact
        if: needs.changes.outputs.resourcepack == 'true' || needs.changes.outputs.all == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: IllyriaResourcePack-Assets
          path: dist/

      - id: download_resourcepack_overlays
        name: Download IllyriaResourcePack Overlays Artifact
        if: needs.changes.outputs.resourcepack == 'true' || needs.changes.outputs.all == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: IllyriaResourcePack-Overlays
          path: dist/

      - id: check_outputs
        name: Check Available Outputs
        run: |
          echo "Artifacts to release:"
          ls -la dist/ || echo "No artifacts downloaded"
          if [ -z "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "::warning::No artifacts to release"
          fi

      - id: update_nightly_tag
        name: Update Nightly Tag
        if: hashFiles('dist/') != ''
        run: |
          gh api repos/${{ github.repository }}/git/refs/tags/nightly \
            --method PATCH \
            --field sha=${{ github.sha }} \
            --field force=true 2>/dev/null || \
          gh api repos/${{ github.repository }}/git/refs \
            --method POST \
            --field ref=refs/tags/nightly \
            --field sha=${{ github.sha }}
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: delete_old_release_assets
        name: Delete Old Release Assets
        if: hashFiles('dist/') != ''
        run: |
          release_id=$(gh api repos/${{ github.repository }}/releases/tags/nightly --jq '.id' 2>/dev/null || echo "")
          if [ -n "$release_id" ]; then
            # Only delete assets we're about to re-upload (built modules)
            built_modules=""
            [ "${{ needs.changes.outputs.core }}" = "true" ] && built_modules="$built_modules IllyriaCore"
            [ "${{ needs.changes.outputs.bridge }}" = "true" ] && built_modules="$built_modules IllyriaBridge"
            [ "${{ needs.changes.outputs.resourcepack }}" = "true" ] && built_modules="$built_modules IllyriaResourcePack"
            [ "${{ needs.changes.outputs.all }}" = "true" ] && built_modules="$built_modules IllyriaCore IllyriaBridge IllyriaResourcePack"

            for module in $built_modules; do
              asset_ids=$(gh api repos/${{ github.repository }}/releases/$release_id/assets \
                --jq ".[] | select(.name | startswith(\"$module\")) | .id" 2>/dev/null || echo "")
              for asset_id in $asset_ids; do
                echo "Deleting old $module asset: $asset_id"
                gh api repos/${{ github.repository }}/releases/assets/$asset_id --method DELETE
              done
            done
          fi
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: create_release
        name: Create Nightly Release
        if: hashFiles('dist/') != ''
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          prerelease: true
          files: dist/*
          tag_name: nightly
          name: Nightly Build
