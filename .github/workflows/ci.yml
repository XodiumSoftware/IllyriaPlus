name: Xodium CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - "IllyriaCore/**"
      - "IllyriaKingdoms/**"
      - "IllyriaBridge/**"
      - "IllyriaResourcePack/**"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
      - "!IllyriaCore/src/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "IllyriaCore/**"
      - "IllyriaKingdoms/**"
      - "IllyriaBridge/**"
      - "IllyriaResourcePack/**"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
      - "!IllyriaCore/src/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      kingdoms: ${{ steps.filter.outputs.kingdoms }}
      bridge: ${{ steps.filter.outputs.bridge }}
      resourcepack: ${{ steps.filter.outputs.resourcepack }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - id: filter
        name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        with:
          filters: |
            core:
              - "IllyriaCore/**"
              - "!IllyriaCore/src/**"
            kingdoms:
              - "IllyriaKingdoms/**"
            bridge:
              - "IllyriaBridge/**"
            resourcepack:
              - "IllyriaResourcePack/**"
            all:
              - "settings.gradle.kts"
              - "gradle.properties"
              - ".github/workflows/ci.yml"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.kingdoms == 'true' ||
      needs.changes.outputs.bridge == 'true' ||
      needs.changes.outputs.all == 'true'
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        uses: actions/checkout@v7.0.1

      - id: setup_java
        name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - id: run_lint
        name: Run Lint
        run: ./gradlew ktlintCheck

  build_core:
    name: Build IllyriaCore
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: setup_java
        name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - id: build
        name: Build Plugin
        run: ./gradlew :IllyriaCore:shadowJar

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: IllyriaCore
          path: IllyriaCore/build/libs/*.jar

  build_kingdoms:
    name: Build IllyriaKingdoms
    needs: [changes]
    if: needs.changes.outputs.kingdoms == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: setup_java
        name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - id: build
        name: Build Plugin
        run: ./gradlew :IllyriaKingdoms:shadowJar

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: IllyriaKingdoms
          path: IllyriaKingdoms/build/libs/*.jar

  build_bridge:
    name: Build IllyriaBridge
    needs: [changes]
    if: needs.changes.outputs.bridge == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: setup_java
        name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - id: build
        name: Build Plugin
        run: ./gradlew :IllyriaBridge:shadowJar

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: IllyriaBridge
          path: IllyriaBridge/build/libs/*.jar

  build_resourcepack:
    name: Build IllyriaResourcePack
    needs: [changes]
    if: needs.changes.outputs.resourcepack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: packsquash
        name: Create Zip & Optimize with Packsquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: v0.4.1
          artifact_name: IllyriaResourcePack
          options: |
            pack_directory = 'IllyriaResourcePack'

  pr_comment:
    name: PR Comment
    needs:
      [changes, build_core, build_kingdoms, build_bridge, build_resourcepack]
    if: |
      always() && github.event_name == 'pull_request' &&
      (needs.build_core.result == 'success' ||
       needs.build_kingdoms.result == 'success' ||
       needs.build_bridge.result == 'success' ||
       needs.build_resourcepack.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post Artifact Link
        uses: actions/github-script@v9
        with:
          script: |
            const botMarker = '<!-- IllyriaPlus Artifact Bot -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${botMarker}
            Build completed for commit \`${context.sha.substring(0, 7)}\`.

            [View Artifacts](${runUrl})
            [View Workflow Run](${runUrl})
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(botMarker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  nightly_release:
    name: Nightly Release
    needs:
      [
        changes,
        lint,
        build_core,
        build_kingdoms,
        build_bridge,
        build_resourcepack,
      ]
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
      url: "${{ steps.create_release.outputs.url }}"
    if: |
      always() && github.ref == 'refs/heads/main' &&
      (needs.build_core.result == 'success' ||
       needs.build_kingdoms.result == 'success' ||
       needs.build_bridge.result == 'success' ||
       needs.build_resourcepack.result == 'success')
    permissions:
      contents: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: download_core
        name: Download IllyriaCore Artifact
        if: needs.build_core.result == 'success'
        uses: actions/download-artifact@v8.0.1
        with:
          name: IllyriaCore
          path: dist/

      - id: download_kingdoms
        name: Download IllyriaKingdoms Artifact
        if: needs.build_kingdoms.result == 'success'
        uses: actions/download-artifact@v8.0.1
        with:
          name: IllyriaKingdoms
          path: dist/

      - id: download_bridge
        name: Download IllyriaBridge Artifact
        if: needs.build_bridge.result == 'success'
        uses: actions/download-artifact@v8.0.1
        with:
          name: IllyriaBridge
          path: dist/

      - id: download_resourcepack
        name: Download IllyriaResourcePack Artifact
        if: needs.build_resourcepack.result == 'success'
        uses: actions/download-artifact@v8.0.1
        with:
          name: IllyriaResourcePack
          path: dist/

      - id: update_nightly_tag
        name: Update Nightly Tag
        run: |
          gh api repos/${{ github.repository }}/git/refs/tags/nightly \
            --method PATCH \
            --field sha=${{ github.sha }} \
            --field force=true 2>/dev/null || \
          gh api repos/${{ github.repository }}/git/refs \
            --method POST \
            --field ref=refs/tags/nightly \
            --field sha=${{ github.sha }}
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: delete_old_release_assets
        name: Delete Old Release Assets
        run: |
          release_id=$(gh api repos/${{ github.repository }}/releases/tags/nightly --jq '.id' 2>/dev/null || echo "")
          if [ -n "$release_id" ]; then
            # Only delete assets we're about to re-upload (built modules)
            built_modules=""
            [ "${{ needs.build_core.result }}" = "success" ] && built_modules="$built_modules IllyriaCore"
            [ "${{ needs.build_kingdoms.result }}" = "success" ] && built_modules="$built_modules IllyriaKingdoms"
            [ "${{ needs.build_bridge.result }}" = "success" ] && built_modules="$built_modules IllyriaBridge"
            [ "${{ needs.build_resourcepack.result }}" = "success" ] && built_modules="$built_modules IllyriaResourcePack"

            for module in $built_modules; do
              asset_ids=$(gh api repos/${{ github.repository }}/releases/$release_id/assets \
                --jq ".[] | select(.name | startswith(\"$module\")) | .id" 2>/dev/null || echo "")
              for asset_id in $asset_ids; do
                echo "Deleting old $module asset: $asset_id"
                gh api repos/${{ github.repository }}/releases/assets/$asset_id --method DELETE
              done
            done
          fi
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: create_release
        name: Create Nightly Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          prerelease: true
          files: dist/*
          tag_name: nightly
          name: Nightly Build
